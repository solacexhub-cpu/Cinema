name: Build Solace Box

on:
  push:
    branches:
      - development
    tags-ignore:
      - "**"
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.8.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Solace Box web app
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Prepare Android web assets
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R build/. android/app/src/main/assets/web/

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk solace-box-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: solace-box-debug
          path: solace-box-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Deploy web build to GitHub Pages
        if: github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          target-folder: ${{ github.head_ref || github.ref_name }}
          force: false
          attempt-limit: 10
